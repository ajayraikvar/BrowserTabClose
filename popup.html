<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EdgeClose</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup-shell">
    <header class="popup-header">
      <div><p class="eyebrow">EdgeClose</p><h1>Protection</h1></div>
      <span id="status-dot" class="status-dot" aria-label="Protection status"></span>
    </header>

    <section class="status-card">
      <strong id="protection-status">Checking…</strong>
      <span id="protection-detail">Loading monitored tabs.</span>
    </section>

    <section id="pause-card" class="pause-card" hidden>
      <strong>Protection paused</strong>
      <span id="pause-detail"></span>
      <button id="resume" class="secondary-button" type="button">Resume now</button>
    </section>

    <section>
      <div class="section-title"><h2>Monitored tabs</h2><span id="tab-count"></span></div>
      <ul id="tab-list" class="tab-list"></ul>
      <p id="no-tabs" class="muted">No monitored tabs.</p>
    </section>

    <section class="actions-card">
      <h2>Pause temporarily</h2>
      <div class="pause-actions">
        <button data-minutes="15" type="button">15 min</button>
        <button data-minutes="60" type="button">1 hour</button>
        <button data-minutes="1440" type="button">24 hours</button>
      </div>
    </section>

    <button id="open-settings" class="primary-button" type="button">Open settings</button>
    <p id="message" class="message" role="status" aria-live="polite"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
