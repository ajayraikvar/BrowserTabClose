# Release pipeline: every versioned main push builds and publishes the matching package.
name: Build extension package

on:
  push:
    branches: [main]
    paths-ignore:
      - "EdgeClose-*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build package
        run: |
          rm -f EdgeClose-*.zip
          zip -r EdgeClose-${GITHUB_SHA}.zip \
            manifest.json \
            background-v163.js \
            content.js \
            content.css \
            options.html \
            options.css \
            options.js \
            options-pro-v163.js \
            managed_schema.json \
            privacy-policy.html

      - name: Rename package to manifest version
        shell: bash
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          mv "EdgeClose-${GITHUB_SHA}.zip" "EdgeClose-${VERSION}.zip"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Commit package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "EdgeClose-${VERSION}.zip"
          git commit -m "Add EdgeClose v${VERSION} package" || exit 0
          git push

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" "EdgeClose-${VERSION}.zip" --clobber
          else
            gh release create "v${VERSION}" "EdgeClose-${VERSION}.zip" \
              --target main \
              --title "EdgeClose v${VERSION}" \
              --notes "EdgeClose v${VERSION} release."
          fi
