# Release pipeline: every versioned source change builds and publishes the matching package.
name: Build extension package

on:
  push:
    branches: [main]
    paths:
      - "manifest.json"
      - "VERSION"
      - "content.js"
      - "content.css"
      - "options.html"
      - "options.css"
      - "options.js"
      - "privacy-policy.html"
      - "managed_schema.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./manifest.json').version")
          SUFFIX=$(echo "$VERSION" | tr -d '.')
          WORKER="background-v${SUFFIX}.js"
          PRO="options-pro-v${SUFFIX}.js"
          rm -f EdgeClose-*.zip
          test -s "$WORKER"
          test -s "$PRO"
          zip -r "EdgeClose-${VERSION}.zip" \
            manifest.json \
            "$WORKER" \
            content.js \
            content.css \
            options.html \
            options.css \
            options.js \
            "$PRO" \
            managed_schema.json \
            privacy-policy.html
          unzip -t "EdgeClose-${VERSION}.zip"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Commit package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "EdgeClose-${VERSION}.zip"
          git commit -m "Add EdgeClose v${VERSION} package" || exit 0
          git push

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" "EdgeClose-${VERSION}.zip" --clobber
          else
            gh release create "v${VERSION}" "EdgeClose-${VERSION}.zip" \
              --target main \
              --title "EdgeClose v${VERSION}" \
              --notes "EdgeClose v${VERSION} release."
          fi
