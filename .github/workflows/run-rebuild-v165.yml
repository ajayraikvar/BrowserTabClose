name: Run EdgeClose v1.6.5 rebuild

on:
  push:
    paths:
      - ".github/workflows/run-rebuild-v165.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix rebuild script source loading
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('rebuild-v165.sh')
          s=p.read_text()
          s=s.replace("import json,re\n", "import json,re,subprocess\n")
          s=s.replace("pp=git_file('privacy-policy.html')", "pp=Path('privacy-policy.html').read_text()")
          s=s.replace("ch=git_file('CHANGELOG.md')", "ch=subprocess.check_output(['git','show',f'{BASE}:CHANGELOG.md'],text=True)")
          p.write_text(s)
          PY
      - name: Rebuild from v1.6.2 canonical source
        run: bash rebuild-v165.sh
      - name: Remove runner files
        shell: bash
        run: |
          rm -f rebuild-v165.sh .github/workflows/rebuild-v165.yml .github/workflows/run-rebuild-v165.yml
          git add -A
          git commit -m "Finalize EdgeClose v1.6.5 rebuild" || exit 0
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
