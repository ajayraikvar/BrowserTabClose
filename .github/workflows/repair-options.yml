name: Repair Options

on:
  push:
    paths:
      - ".github/workflows/repair-options.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch options.js
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('options.js')
          s = p.read_text()
          s = s.replace('async function loadAuditLog() {\n  const entries', 'async function loadAuditLog() {\n  if (!auditList || !auditEmpty) return;\n  const entries')
          s = s.replace('async function refreshDashboard() {\n  const state', 'async function refreshDashboard() {\n  if (!policySource || !policyPrecedence || !ruleCount || !monitoredCount || !protectionState || !pauseState) return;\n  const state')
          s = s.replace('checkUpdatesButton.addEventListener("click", checkForUpdates);', 'checkUpdatesButton?.addEventListener?.("click", checkForUpdates);')
          start = s.find('async function checkForUpdates() {')
          end = s.find('\n\ncheckUpdatesButton', start)
          if start >= 0:
              if end < 0: end = len(s)
              s = s[:start] + "async function checkForUpdates() { if (updateStatus) updateStatus.textContent = 'Microsoft Edge manages Store updates automatically.'; if (availableVersion) availableVersion.textContent = currentVersion; if (availableVersions) availableVersions.replaceChildren(); }" + s[end:]
          p.write_text(s)
          PY
          node --check options.js
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add options.js
          git commit -m "Fix v1.6.4 options null safety" || exit 0
          git push
      - name: Remove workflow
        run: |
          rm -f .github/workflows/repair-options.yml
          git add -u .github/workflows/repair-options.yml
          git commit -m "Remove one-time Options repair workflow" || true
          git push || true
