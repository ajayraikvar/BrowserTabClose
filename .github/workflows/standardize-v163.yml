name: Standardize EdgeClose v1.6.3

on:
  push:
    paths:
      - ".github/workflows/standardize-v163.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  standardize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v1.6.3 changes
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          root = Path('.')
          manifest = json.loads((root/'manifest.json').read_text())
          manifest['version'] = '1.6.3'
          manifest['permissions'] = ['tabs','storage','alarms','downloads']
          manifest['host_permissions'] = ['<all_urls>']
          manifest['background'] = {'service_worker':'background-v163.js'}
          (root/'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          (root/'VERSION').write_text('1.6.3\n')

          # Remove old backup/recovery wiring from the Options page.
          opt = (root/'options.html').read_text()
          opt = opt.replace('<section class="update-panel" aria-labelledby="updates-title"><h2 id="updates-title">Updates</h2><p class="field-help">EdgeClose checks published releases for newer versions. Passwords and browsing data are never included.</p><dl class="version-summary"><div><dt>Installed</dt><dd id="installed-version"></dd></div><div><dt>Latest available</dt><dd id="available-version">Checking...</dd></div></dl><ul id="available-versions" class="version-list" aria-label="Available releases"></ul><button type="button" id="check-updates" class="text-button">Check now</button><span id="update-status" class="status" role="status" aria-live="polite"></span></section>', '<section class="update-panel" aria-labelledby="updates-title"><h2 id="updates-title">Version</h2><p class="field-help">Microsoft Edge automatically delivers approved updates from the Microsoft Edge Add-ons Store. No GitHub update service is used by EdgeClose.</p><dl class="version-summary"><div><dt>Installed</dt><dd id="installed-version"></dd></div></dl></section>')
          opt = opt.replace('  <script src="backup-lifecycle.js"></script>\n','')
          (root/'options.html').write_text(opt)

          # Replace Pro layer with Options-only protection controls. No backup/recovery UI.
          pro = r'''(() => {
            const $ = (selector) => document.querySelector(selector);
            const inject = () => {
              if (!$('#protected-content') || $('#ec163-controls')) return;
              const root = $('#protected-content');
              const section = document.createElement('section');
              section.id = 'ec163-controls';
              section.className = 'ec160-card';
              section.innerHTML = '<div class="ec160-head"><div><p class="ec160-kicker">Protection control</p><h2>Temporary pause</h2><p class="ec160-copy">Pause and resume are available only from this page. Every action requires your settings password.</p></div><span id="ec163-pill" class="ec160-pill">Protection ON</span></div><div class="ec160-actions"><button type="button" data-ec-pause="15">15 minutes</button><button type="button" data-ec-pause="60">1 hour</button><button type="button" data-ec-pause="1440">24 hours</button><button id="ec163-resume" type="button" class="wide">Resume protection</button></div>';
              root.insertBefore(section, root.children[1] || root.firstChild);
              const modal = document.createElement('div'); modal.className = 'ec160-modal'; modal.hidden = true;
              modal.innerHTML = '<div class="ec160-dialog" role="dialog" aria-modal="true"><h2>Password required</h2><p id="ec163-copy">Enter your settings password to continue.</p><form id="ec163-form"><input id="ec163-password" type="password" autocomplete="current-password" required><div class="ec160-dialog-actions"><button type="button" id="ec163-cancel" class="text-button">Cancel</button><button type="submit" class="primary-button">Confirm</button></div><p id="ec163-error" class="ec160-status"></p></form></div>';
              document.body.append(modal);
              const ask = (copy, action) => new Promise((resolve) => {
                $('#ec163-copy').textContent = copy; $('#ec163-password').value=''; $('#ec163-error').textContent=''; modal.hidden=false;
                const cancel=()=>{modal.hidden=true; cleanup(); resolve(false);};
                const submit=async(e)=>{e.preventDefault(); const p=$('#ec163-password').value; const ok=await window.EdgeCloseAuth?.verify?.(p); if(ok===false){$('#ec163-error').textContent='Incorrect password.';return;} if(window.EdgeCloseAuth?.verify){await action(p);} else {$('#ec163-error').textContent='Authentication unavailable.';return;} modal.hidden=true; cleanup(); resolve(true);};
                const cleanup=()=>{$('#ec163-cancel').removeEventListener('click',cancel); $('#ec163-form').removeEventListener('submit',submit);};
                $('#ec163-cancel').addEventListener('click',cancel); $('#ec163-form').addEventListener('submit',submit); $('#ec163-password').focus();
              });
              const refresh = async()=>{const s=await chrome.runtime.sendMessage({type:'edgeclose-admin-state'}).catch(()=>null); const pill=$('#ec163-pill'); if(pill&&s){pill.textContent=s.paused?'Protection paused':'Protection ON'; pill.classList.toggle('paused',!!s.paused);}};
              section.querySelectorAll('[data-ec-pause]').forEach(b=>b.addEventListener('click',()=>ask('Enter your settings password to pause protection.',async()=>{await chrome.runtime.sendMessage({type:'edgeclose-pause',minutes:Number(b.dataset.ecPause)}); await refresh();})));
              $('#ec163-resume').addEventListener('click',()=>ask('Enter your settings password to resume protection.',async()=>{await chrome.runtime.sendMessage({type:'edgeclose-resume'}); await refresh();}));
              refresh();
            };
            inject();
          })();
          '''
          (root/'options-pro.js').write_text(pro)

          # New compact service worker: no configuration backup downloads; only sanitized audit log file.
          bg = r'''const VERSION = '1.6.3';
          const DEFAULT_TIMEOUT = 900;
          const DEFAULT_WARNING = 10;
          const MAX_AUDIT = 200;
          const CHECK_ALARM = 'edgeclose-check';
          const WARNING_PREFIX = 'edgeclose-warning-';
          const CLOSE_PREFIX = 'edgeclose-close-';
          const ACTIVITY_PREFIX = 'edgeclose-last-activity-';
          const INHERITED_PREFIX = 'edgeclose-inherited-';
          const PAUSE_KEY = 'edgeclose-pause-until';
          const AUDIT_KEY = 'edgeclose-audit-log';

          const normalizeTime=v=>/^([01]\\d|2[0-3]):[0-5]\\d$/.test(String(v||''))?String(v):'';
          const normalizeTimeout=v=>{const n=Number(v);return Number.isFinite(n)?Math.max(15,Math.min(86400,Math.round(n))):DEFAULT_TIMEOUT;};
          const normalizeWarning=(v,t)=>{const n=Number(v);return Number.isFinite(n)?Math.max(1,Math.min(t-1,Math.round(n))):Math.min(DEFAULT_WARNING,t-1);};
          const normalizeSite=s=>{const t=normalizeTimeout(s?.timeoutSeconds);return {pattern:String(s?.pattern||'').trim(),timeoutSeconds:t,warningSeconds:normalizeWarning(s?.warningSeconds,t),fromTime:normalizeTime(s?.fromTime),toTime:normalizeTime(s?.toTime),soundEnabled:s?.soundEnabled!==false};};
          const normalizeSites=(sites,legacy=[])=>{const src=Array.isArray(sites)&&sites.length?sites:(Array.isArray(legacy)?legacy.map(pattern=>({pattern})):[]);return src.map(normalizeSite).filter(s=>s.pattern).slice(0,100);};
          function isWithinSchedule(s,d=new Date()){if(!s.fromTime||!s.toTime)return true;const n=d.getHours()*60+d.getMinutes(),[fh,fm]=s.fromTime.split(':').map(Number),[th,tm]=s.toTime.split(':').map(Number),f=fh*60+fm,t=th*60+tm;if(f===t)return true;return f<t?n>=f&&n<t:n>=f||n<t;}
          function scheduleStart(s,d=new Date()){if(!s.fromTime||!s.toTime)return 0;const[h,m]=s.fromTime.split(':').map(Number),x=new Date(d);x.setHours(h,m,0,0);if(x>d&&s.fromTime>s.toTime)x.setDate(x.getDate()-1);return x.getTime();}
          function matches(pattern,url){if(!pattern||!url)return false;if(!pattern.includes('://')){try{const host=new URL(url).hostname.replace(/^www\\./i,''),domain=pattern.trim().replace(/^\\*\\.?/,'').replace(/^www\\./i,''),esc=domain.replace(/[.+?^${}()|[\\]\\\\]/g,'\\\\$&').replace(/\\*/g,'.*');return new RegExp(`(^|\\\\.)${esc}$`,'i').test(host);}catch{return false;}}const esc=pattern.replace(/[.+?^${}()|[\\]\\\\]/g,'\\\\$&');return new RegExp(`^${esc.replace(/\\*/g,'.*')}\\\\/?$`,'i').test(url);}
          function priority(p){const v=p.trim(),wc=(v.match(/\\*/g)||[]).length;let s=v.includes('://')?400000:200000;if(!wc)s+=50000;if(v.includes('/'))s+=3000;s+=Math.min(1000,v.replace(/\\*/g,'').length)*10;return s-wc*500;}
          async function settings(){const managed=await chrome.storage.managed.get({sites:undefined}).catch(()=>({}));const local=await chrome.storage.local.get({sites:[],patterns:[]});const mp=Array.isArray(managed.sites);return {sites:normalizeSites(mp?managed.sites:local.sites,mp?[]:local.patterns),managed:mp};}
          async function pauseUntil(){const s=await chrome.storage.local.get(PAUSE_KEY),n=Number(s[PAUSE_KEY])||0;if(n>Date.now())return n;if(n)await chrome.storage.local.remove(PAUSE_KEY);return 0;}
          const paused=async()=>await pauseUntil()>Date.now();
          async function siteForTab(tab){if(await paused())return null;const cfg=await settings();const list=cfg.sites.map((site,index)=>({site,index,score:priority(site.pattern)})).filter(x=>matches(x.site.pattern,tab.url)&&isWithinSchedule(x.site)).sort((a,b)=>b.score-a.score||a.index-b.index);if(list.length)return list[0].site;if(Number.isInteger(tab.id)){const k=INHERITED_PREFIX+tab.id,s=await chrome.storage.session.get(k);if(s[k]&&isWithinSchedule(s[k]))return normalizeSite(s[k]);}return null;}
          const activityKey=id=>ACTIVITY_PREFIX+id,warningName=id=>WARNING_PREFIX+id,closeName=id=>CLOSE_PREFIX+id;
          async function lastActivity(id){const k=activityKey(id),s=await chrome.storage.session.get(k),n=Number(s[k]);if(n>0)return n;const now=Date.now();await chrome.storage.session.set({[k]:now});return now;}
          async function clearAlarms(id){await chrome.alarms.clear(warningName(id));await chrome.alarms.clear(closeName(id));}
          async function schedule(id,activity,site){await clearAlarms(id);if(await paused()||!isWithinSchedule(site))return;const effective=Math.max(activity,scheduleStart(site)),elapsed=(Date.now()-effective)/1000,warning=site.timeoutSeconds-site.warningSeconds-elapsed,close=site.timeoutSeconds-elapsed;if(warning>0)await chrome.alarms.create(warningName(id),{delayInMinutes:warning/60});if(close>0)await chrome.alarms.create(closeName(id),{delayInMinutes:close/60});}
          async function reschedule(){if(await paused()){const a=await chrome.alarms.getAll();await Promise.all(a.filter(x=>x.name.startsWith(WARNING_PREFIX)||x.name.startsWith(CLOSE_PREFIX)).map(x=>chrome.alarms.clear(x.name)));return;}const tabs=await chrome.tabs.query({});await Promise.all(tabs.map(async tab=>{if(!Number.isInteger(tab.id))return;const site=tab.url&&await siteForTab(tab);if(!site)return clearAlarms(tab.id);await schedule(tab.id,await lastActivity(tab.id),site);}));}
          async function closeIfDue(id){if(await paused())return;const tab=await chrome.tabs.get(id).catch(()=>null),site=tab&&await siteForTab(tab);if(!tab||!site||!isWithinSchedule(site))return;const activity=await lastActivity(id),deadline=Math.max(activity,scheduleStart(site))+site.timeoutSeconds*1000;if(Date.now()>=deadline){await chrome.tabs.remove(id);await audit('tab_closed',{});}else await schedule(id,activity,site);}

          function safeMetadata(metadata){const blocked=new Set(['password','passwordHash','salt','token','secret','url','pattern','title']);const out={};for(const[k,v]of Object.entries(metadata||{}))if(!blocked.has(k)&&['string','number','boolean'].includes(typeof v))out[k]=v;return out;}
          function jsonDataUrl(value){return 'data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(value,null,2));}
          async function writeAuditFile(entries){try{const hits=await chrome.downloads.search({query:'EdgeClose/audit-log.json',limit:50});if(hits.length)await chrome.downloads.erase({query:'EdgeClose/audit-log.json'}).catch(()=>{});await chrome.downloads.download({url:jsonDataUrl({schemaVersion:1,version:VERSION,generatedAt:Date.now(),events:entries.slice(0,MAX_AUDIT)}),filename:'EdgeClose/audit-log.json',saveAs:false,conflictAction:'overwrite'});}catch{}}
          async function audit(event,metadata={}){const s=await chrome.storage.local.get(AUDIT_KEY),current=Array.isArray(s[AUDIT_KEY])?s[AUDIT_KEY]:[],next=[{timestamp:Date.now(),event:String(event).slice(0,40),metadata:safeMetadata(metadata)},...current].slice(0,MAX_AUDIT);await chrome.storage.local.set({[AUDIT_KEY]:next});await writeAuditFile(next);}

          async function adminState(){const cfg=await settings(),tabs=await chrome.tabs.query({}),p=await paused();let count=0;if(!p)for(const tab of tabs)if(Number.isInteger(tab.id)&&await siteForTab(tab))count++;const a=await chrome.storage.local.get(AUDIT_KEY);return{managed:cfg.managed,source:cfg.managed?'Managed policy':'Local settings',precedence:'Managed policy > local settings',ruleCount:cfg.sites.length,monitoredCount:count,paused:p,auditCount:Array.isArray(a[AUDIT_KEY])?a[AUDIT_KEY].length:0};}
          async function setPause(minutes){const n=Math.max(1,Math.min(1440,Math.round(Number(minutes)||15))),until=Date.now()+n*60000;await chrome.storage.local.set({[PAUSE_KEY]:until});await reschedule();await audit('pause_set',{durationMinutes:n});await broadcast();return until;}
          async function resume(){await chrome.storage.local.remove(PAUSE_KEY);await reschedule();await audit('pause_cleared',{});await broadcast();}
          async function broadcast(){const tabs=await chrome.tabs.query({}),p=await paused();await Promise.all(tabs.map(async tab=>{if(!Number.isInteger(tab.id))return;const site=!p&&tab.url&&await siteForTab(tab);if(!site){chrome.tabs.sendMessage(tab.id,{type:'edgeclose-status',enabled:false,paused:p}).catch(()=>{});return;}const a=await lastActivity(tab.id),deadline=Math.max(a,scheduleStart(site))+site.timeoutSeconds*1000,remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));chrome.tabs.sendMessage(tab.id,{type:'edgeclose-status',scheduleActive:true,timeoutSeconds:site.timeoutSeconds,warningSeconds:site.warningSeconds,soundEnabled:site.soundEnabled,idleState:remaining<=site.warningSeconds&&remaining>0?'warning':'active',remainingSeconds:remaining,deadlineAt:deadline,paused:false}).catch(()=>{});}));}
          async function markActive(id){if(await paused())return;const now=Date.now();await chrome.storage.session.set({[activityKey(id)]:now});const tab=await chrome.tabs.get(id).catch(()=>null),site=tab&&await siteForTab(tab);if(site)await schedule(id,now,site);}

          chrome.runtime.onInstalled.addListener(details=>{if(details.reason==='install'){audit('extension_installed',{});chrome.runtime.openOptionsPage();}else if(details.reason==='update')audit('extension_updated',{});configure();reschedule();broadcast();});
          chrome.runtime.onStartup.addListener(()=>{configure();reschedule();broadcast();});
          function configure(){chrome.alarms.clear(CHECK_ALARM);chrome.alarms.create(CHECK_ALARM,{periodInMinutes:0.5});}
          chrome.action.onClicked.addListener(()=>chrome.runtime.openOptionsPage());
          chrome.tabs.onActivated.addListener(()=>broadcast());
          chrome.tabs.onCreated.addListener(async tab=>{if(!Number.isInteger(tab.id)||!Number.isInteger(tab.openerTabId)||await paused())return;const opener=await chrome.tabs.get(tab.openerTabId).catch(()=>null),site=opener&&await siteForTab(opener);if(site){await chrome.storage.session.set({[INHERITED_PREFIX+tab.id]:site});await markActive(tab.id);}});
          chrome.tabs.onUpdated.addListener((id,info)=>{if(info.status==='complete'){markActive(id);broadcast();}});
          chrome.tabs.onRemoved.addListener(async id=>{await chrome.storage.session.remove([activityKey(id),INHERITED_PREFIX+id]);await clearAlarms(id);});
          chrome.alarms.onAlarm.addListener(async alarm=>{if(alarm.name===CHECK_ALARM){await reschedule();await broadcast();return;}if(alarm.name.startsWith(CLOSE_PREFIX)){await closeIfDue(Number(alarm.name.slice(CLOSE_PREFIX.length)));}else if(alarm.name.startsWith(WARNING_PREFIX)){await broadcast();}});
          chrome.runtime.onMessage.addListener((message,sender,sendResponse)=>{if(message.type==='edgeclose-activity'&&Number.isInteger(sender.tab?.id)){markActive(sender.tab.id);return;}if(message.type==='edgeclose-deadline'&&Number.isInteger(sender.tab?.id)){closeIfDue(sender.tab.id);return;}if(message.type==='edgeclose-pause'){setPause(message.minutes).then(until=>sendResponse({ok:true,pauseUntil:until})).catch(()=>sendResponse({ok:false}));return true;}if(message.type==='edgeclose-resume'){resume().then(()=>sendResponse({ok:true})).catch(()=>sendResponse({ok:false}));return true;}if(message.type==='edgeclose-admin-state'){adminState().then(sendResponse).catch(()=>sendResponse(null));return true;}if(message.type==='edgeclose-audit-log'){chrome.storage.local.get(AUDIT_KEY).then(s=>sendResponse(Array.isArray(s[AUDIT_KEY])?s[AUDIT_KEY].slice(0,MAX_AUDIT):[])).catch(()=>sendResponse([]));return true;}if(message.type==='edgeclose-audit'){audit(message.event,message.metadata||{}).then(()=>sendResponse({ok:true})).catch(()=>sendResponse({ok:false}));return true;}});
          chrome.storage.onChanged.addListener((changes,area)=>{if(area==='local'&&(changes.sites||changes.patterns||changes[PAUSE_KEY])){reschedule();broadcast();}});
          '''
          (root/'background-v163.js').write_text(bg)

          # Make Options page version/update section local-only; remove GitHub fetch logic.
          ojs = (root/'options.js').read_text()
          start = ojs.find('async function checkForUpdates() {')
          end = ojs.find('\n\ncheckUpdatesButton.addEventListener', start)
          if start != -1 and end != -1:
              replacement = "async function checkForUpdates() { updateStatus.textContent = 'Microsoft Edge manages Store updates automatically.'; availableVersion.textContent = currentVersion; }"
              ojs = ojs[:start] + replacement + ojs[end:]
          if 'checkUpdatesButton.addEventListener' in ojs:
              ojs = ojs.replace('checkUpdatesButton.addEventListener("click", checkForUpdates);','checkUpdatesButton?.removeEventListener?.("click", checkForUpdates);')
          ojs = ojs.replace('  checkForUpdates();\n','')
          ojs = ojs.replace('  loadAuditLog();\n','  loadAuditLog();\n')
          # Expose password verifier hook to the Options-only pause UI without storing the password.
          marker='async function verifyPassword(password) {'
          idx=ojs.find(marker)
          if idx!=-1:
              endfn=ojs.find('\n}\n\nasync function getLockoutUntil',idx)
              hook='\nwindow.EdgeCloseAuth = { verify: verifyPassword };\n'
              ojs=ojs[:endfn+2]+hook+ojs[endfn+2:]
          # Remove old repository/update constants and DOM refs if present; harmless when unused.
          (root/'options.js').write_text(ojs)

          # Package only the current runtime.
          p=(root/'.github/workflows/package.yml').read_text()
          p=p.replace('background-v160.js','background-v163.js').replace('            backup-lifecycle.js \\\n','')
          (root/'.github/workflows/package.yml').write_text(p)

          # Privacy policy: make current data behavior explicit.
          pp=(root/'privacy-policy.html').read_text()
          pp=re.sub(r'(<h2[^>]*>.*?(?:Data|Audit|Information).*?</h2>)', r'\\1', pp, count=1, flags=re.I|re.S)
          if 'audit-log.json' not in pp:
              pp=pp.replace('</main>', '<section><h2>Local audit log</h2><p>EdgeClose records only management events needed for the extension, such as installation, settings changes, pause/resume actions, and tab-close events. It does not record page contents, page titles, passwords, or URLs. A sanitized audit log is maintained locally and an up-to-date copy is stored as <code>Downloads/EdgeClose/audit-log.json</code>. No audit data is sent to a remote server.</p></section></main>')
          (root/'privacy-policy.html').write_text(pp)

          # Remove obsolete backup lifecycle from the source tree.
          old=root/'backup-lifecycle.js'
          if old.exists(): old.unlink()
          for old_name in ['popup.html','popup.css','popup.js']:
              q=root/old_name
              if q.exists(): q.unlink()

          # Remove self-modifying workflow after the one-time migration.
          (root/'.github/workflows/standardize-v163.yml').unlink(missing_ok=True)
          PY

      - name: Validate files
        run: |
          node --check content.js
          node --check options.js
          node --check options-pro.js
          node --check background-v163.js
          node -e "const m=require('./manifest.json'); if(m.version!=='1.6.3') process.exit(1); if(m.background.service_worker!=='background-v163.js') process.exit(1); if(m.host_permissions && m.host_permissions.some(x=>x.includes('api.github.com'))) process.exit(1);"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release EdgeClose v1.6.3 with standard update and audit flow" || exit 0
          git push
