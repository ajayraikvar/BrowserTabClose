name: Validate extension

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check background.js
          node --check content.js
          node --check options.js
          node --check popup.js

      - name: Validate JSON and version
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          JSON.parse(fs.readFileSync('managed_schema.json', 'utf8'));
          const version = fs.readFileSync('VERSION', 'utf8').trim();
          if (manifest.version !== version) {
            throw new Error(`VERSION mismatch: manifest=${manifest.version}, VERSION=${version}`);
          }
          if (manifest.action?.default_popup !== 'popup.html') {
            throw new Error('Toolbar popup is not configured');
          }
          if (manifest.content_security_policy?.extension_pages !== "script-src 'self'; object-src 'self';") {
            throw new Error('Extension CSP is missing or unexpected');
          }
          NODE
