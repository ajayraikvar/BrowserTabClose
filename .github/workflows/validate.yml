name: Validate extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check background-v160.js
          node --check content.js
          node --check options.js
          node --check options-pro.js
          node --check options-pro-hotfix.js

      - name: Run repository unit tests
        run: |
          node tests/test-patterns.js
          node tests/test-schedule.js

      - name: Validate JSON and manifest
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          JSON.parse(fs.readFileSync('managed_schema.json', 'utf8'));
          const version = fs.readFileSync('VERSION', 'utf8').trim();
          if (manifest.version !== version) throw new Error(`VERSION mismatch: manifest=${manifest.version}, VERSION=${version}`);
          if (manifest.background?.service_worker !== 'background-v160.js') throw new Error('Unexpected background service worker');
          if (manifest.action?.default_popup) throw new Error('Toolbar popup must not be configured');
          if (manifest.content_security_policy?.extension_pages !== "script-src 'self'; object-src 'self';") throw new Error('Extension CSP is missing or unexpected');
          const required = ['manifest.json','background-v160.js','content.js','content.css','options.html','options.css','options.js','options-pro.js','options-pro-hotfix.js','managed_schema.json','privacy-policy.html'];
          for (const file of required) if (!fs.existsSync(file)) throw new Error(`Missing package file: ${file}`);
          NODE
