name: Prepare complete EdgeClose v1.6.6 rebuild

on:
  push:
    paths:
      - ".github/workflows/release-v166.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild v1.6.6 from v1.6.2 canonical baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          BASE=v1.6.2
          for f in CHANGELOG.md README.md managed_schema.json content.css content.js options.css options.html options.js options-pro.js privacy-policy.html background-v160.js manifest.json; do
            git show "$BASE:$f" > "$f"
          done
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          BASE='v1.6.2'
          def show(path): return subprocess.check_output(['git','show',f'{BASE}:{path}'],text=True)

          manifest=json.loads(show('manifest.json'))
          manifest['version']='1.6.6'
          manifest['permissions']=['tabs','storage','alarms','downloads']
          manifest['host_permissions']=['<all_urls>']
          manifest['background']={'service_worker':'background-v166.js'}
          manifest['options_page']='options.html'
          manifest['action']={'default_title':'EdgeClose'}
          Path('manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          Path('VERSION').write_text('1.6.6\n')

          # Full 1.6.2 background engine, made self-contained.
          bg=show('background-v160.js').replace('const VERSION = "1.6.0";','const VERSION = "1.6.6";')
          bg=bg.replace('const PUBLIC_KEY = "edgeclose-backup-public-key";\nconst BACKUP_PATH = "EdgeClose/config-audit.enc";\n','')
          # Remove legacy backup helpers.
          a=bg.index('async function publicKey()'); b=bg.index('chrome.runtime.onInstalled.addListener',a); bg=bg[:a]+bg[b:]
          # Replace audit with one current Downloads file + sanitized local events.
          a=bg.index('async function audit(event, metadata = {}) {'); b=bg.index('async function closeIfDue',a)
          audit='''async function audit(event, metadata = {}) {\n  const blocked = new Set(["password","passwordHash","salt","token","secret","url","pattern","title"]);\n  const safe = {};\n  for (const [key,value] of Object.entries(metadata || {})) if (!blocked.has(key) && ["string","number","boolean"].includes(typeof value)) safe[key]=value;\n  const stored = await chrome.storage.local.get(AUDIT_KEY);\n  const current = Array.isArray(stored[AUDIT_KEY]) ? stored[AUDIT_KEY] : [];\n  const next = [{timestamp:Date.now(),event:String(event).slice(0,40),metadata:safe},...current].slice(0,MAX_AUDIT);\n  await chrome.storage.local.set({[AUDIT_KEY]:next});\n  if (!audit.writeQueue) audit.writeQueue=Promise.resolve();\n  audit.writeQueue=audit.writeQueue.then(async()=>{\n    try {\n      const found=await chrome.downloads.search({filename:"EdgeClose/audit-log.json"});\n      for (const item of found) if (Number.isInteger(item.id)) await chrome.downloads.erase({id:item.id}).catch(()=>{});\n      await chrome.downloads.download({url:`data:application/json;charset=utf-8,${encodeURIComponent(JSON.stringify({schemaVersion:1,version:VERSION,generatedAt:Date.now(),events:next},null,2))}`,filename:"EdgeClose/audit-log.json",saveAs:false,conflictAction:"overwrite"});\n    } catch {}\n  }).catch(()=>{});\n}\n'''
          bg=bg[:a]+audit+bg[b:]
          bg=re.sub(r'\s*queueBackup\(\);','',bg)
          # Authenticated pause/resume; use the same PBKDF2 verifier stored by options.js.
          auth='''const AUTH_HASH_KEY="edgeclose-settings-password-hash";\nconst AUTH_SALT_KEY="edgeclose-settings-password-salt";\nconst AUTH_ITERATIONS_KEY="edgeclose-settings-password-iterations";\nasync function verifyActionPassword(password){try{const s=await chrome.storage.local.get([AUTH_HASH_KEY,AUTH_SALT_KEY,AUTH_ITERATIONS_KEY]);if(!s[AUTH_HASH_KEY]||!s[AUTH_SALT_KEY])return false;const key=await crypto.subtle.importKey("raw",new TextEncoder().encode(String(password||"")),"PBKDF2",false,["deriveBits"]);const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:Uint8Array.from(atob(s[AUTH_SALT_KEY]),c=>c.charCodeAt(0)),iterations:Number(s[AUTH_ITERATIONS_KEY])||310000,hash:"SHA-256"},key,256);const a=new Uint8Array(bits),e=Uint8Array.from(atob(s[AUTH_HASH_KEY]),c=>c.charCodeAt(0));if(a.length!==e.length)return false;let d=0;for(let i=0;i<a.length;i++)d|=a[i]^e[i];return d===0;}catch{return false;}}\n'''
          a=bg.index('async function setPause(minutes)'); b=bg.index('async function clearTabAlarmsAll()',a)
          pause=auth+'''async function setPause(minutes,password){if(!(await verifyActionPassword(password)))return 0;const n=Math.max(1,Math.min(1440,Math.round(Number(minutes)||15)));const until=Date.now()+n*60000;await chrome.storage.local.set({[PAUSE_KEY]:until});await clearTabAlarmsAll();await statusBroadcast();await audit("pause_set",{durationMinutes:n});return until;}\nasync function resume(password){if(!(await verifyActionPassword(password)))return false;await chrome.storage.local.remove(PAUSE_KEY);await chrome.alarms.clear(PAUSE_ALARM);await reschedule();await statusBroadcast();await audit("pause_cleared",{});return true;}\n'''
          bg=bg[:a]+pause+bg[b:]
          bg=bg.replace('setPause(message.minutes).then((until) => sendResponse({ ok: true, pauseUntil: until }))','setPause(message.minutes, message.password).then((until) => sendResponse({ ok: until > 0, pauseUntil: until }))')
          bg=bg.replace('resume().then(() => sendResponse({ ok: true }))','resume(message.password).then((ok) => sendResponse({ ok }))')
          # Ensure no legacy backup route remains.
          bg=bg.replace('if (message.type === "edgeclose-backup-now") { encryptedBackup().then(() => sendResponse({ ok: true })).catch(() => sendResponse({ ok: false })); return true; }','')
          Path('background-v166.js').write_text(bg)

          # Content baseline with trusted-gesture audio and deadline retry.
          content=show('content.js').replace('let audioContext;','let audioContext;\nlet deadlineRetryTimer;')
          content=content.replace('''function playWarningSound() {\n  try {\n    if (!audioContext) audioContext = new AudioContext();\n    if (audioContext.state === "suspended") audioContext.resume();''','''function initAudioFromGesture(){\n  if(!soundEnabled||audioContext)return;\n  try{audioContext=new AudioContext();if(audioContext.state==="suspended")audioContext.resume().catch(()=>{});}catch{audioContext=null;}\n}\nfunction playWarningSound(){\n  try{\n    if(!audioContext||audioContext.state!=="running")return;''')
          content=content.replace('''    if (soundEnabled && !audioContext) {\n      try { audioContext = new AudioContext(); } catch { audioContext = null; }\n    }\n    if (soundEnabled && audioContext?.state === "suspended") audioContext.resume().catch(() => {});''','    initAudioFromGesture();')
          a=content.index('function armDeadlineTimer() {'); b=content.index('\n}\n\nchrome.runtime.onMessage.addListener',a)+2
          content=content[:a]+'''function armDeadlineTimer(){window.clearTimeout(deadlineTimer);window.clearInterval(deadlineRetryTimer);if(!deadlineAt||!scheduleActive||window.top!==window)return;const trigger=()=>chrome.runtime.sendMessage({type:"edgeclose-deadline"}).catch(()=>{});const delay=Math.max(0,deadlineAt-Date.now());deadlineTimer=window.setTimeout(()=>{trigger();let attempts=0;deadlineRetryTimer=window.setInterval(()=>{attempts+=1;if(!scheduleActive||Date.now()+1000<deadlineAt||attempts>8){window.clearInterval(deadlineRetryTimer);return;}trigger();},1000);},delay);}'''+content[b:]
          content=content.replace('window.clearTimeout(deadlineTimer);\n    deadlineAt = 0;','window.clearTimeout(deadlineTimer);\n    window.clearInterval(deadlineRetryTimer);\n    deadlineAt = 0;')
          Path('content.js').write_text(content)

          # Full Options UI/auth baseline, remove backup and remote updater, add new Pro pause control.
          html=show('options.html')
          html=html.replace('<script src="backup-lifecycle.js"></script>','')
          html=html.replace('<script src="options-pro.js"></script>','<script src="options-pro-v166.js"></script>')
          html=html.replace('EdgeClose checks published releases for newer versions. Passwords and browsing data are never included.','Microsoft Edge manages updates for extensions installed from the Microsoft Edge Add-ons Store.')
          html=html.replace('<ul id="available-versions" class="version-list" aria-label="Available releases"></ul>','')
          html=html.replace('<button type="button" id="check-updates" class="text-button">Check now</button>','')
          Path('options.html').write_text(html)
          opts=show('options.js')
          a=opts.index('async function checkForUpdates() {'); b=opts.index('\n\ncheckUpdatesButton.addEventListener',a); opts=opts[:a]+"async function checkForUpdates(){if(updateStatus)updateStatus.textContent='Microsoft Edge manages updates for Store-installed extensions.';if(availableVersion)availableVersion.textContent=currentVersion;if(availableVersions)availableVersions.replaceChildren();}"+opts[b:]
          opts=opts.replace('checkUpdatesButton.addEventListener("click", checkForUpdates);','checkUpdatesButton?.addEventListener?.("click", checkForUpdates);')
          opts=opts.replace('async function loadAuditLog() {\n  const entries','async function loadAuditLog() {\n  if(!auditList||!auditEmpty)return;\n  const entries')
          opts=opts.replace('async function refreshDashboard() {\n  const state','async function refreshDashboard() {\n  if(!policySource||!policyPrecedence||!ruleCount||!monitoredCount||!protectionState||!pauseState)return;\n  const state')
          opts=opts.replace('function unlockSettings() {\n  authGate.hidden = true;','function unlockSettings() {\n  if(!authGate||!protectedContent)return;\n  authGate.hidden = true;')
          Path('options.js').write_text(opts)

          pro='''(()=>{const $=s=>document.querySelector(s);const style=document.createElement("style");style.textContent='.ec166-card{margin:0 0 18px;padding:22px;border:1px solid #dbe4e7;border-radius:16px;background:#fff;box-shadow:0 14px 34px rgba(20,47,58,.07)}.ec166-head{display:flex;justify-content:space-between;gap:18px}.ec166-kicker{margin:0 0 6px;color:#1f6feb;font-size:.7rem;font-weight:850;letter-spacing:.1em;text-transform:uppercase}.ec166-head h2{margin:0;font-size:1.12rem}.ec166-copy{margin:7px 0 16px;color:#66767d;font-size:.82rem;line-height:1.5}.ec166-pill{display:inline-flex;padding:7px 10px;border-radius:999px;background:#eaf8f1;color:#16835b;font-size:.7rem;font-weight:850}.ec166-pill.paused{background:#fff6de;color:#a36a00}.ec166-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.ec166-actions button{padding:11px 8px;border:1px solid #dbe4e7;border-radius:10px;background:#f7fafb;color:#172329;font:800 .78rem Inter,sans-serif;cursor:pointer}.ec166-actions .wide{grid-column:1/-1;background:#eaf8f1;border-color:#c7e8d8;color:#16835b}.ec166-modal{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;padding:20px;background:rgba(13,25,32,.46)}.ec166-dialog{width:min(100%,410px);padding:24px;border:1px solid #dbe4e7;border-radius:16px;background:#fff;box-shadow:0 24px 80px rgba(13,25,32,.25)}.ec166-dialog form{display:grid;gap:10px}.ec166-dialog input{max-width:none}.ec166-dialog-actions{display:flex;justify-content:flex-end;gap:8px}.ec166-status{min-height:18px;color:#b23b36;font-size:.76rem;font-weight:700}@media(max-width:700px){.ec166-actions{grid-template-columns:1fr}.ec166-actions .wide{grid-column:auto}}';document.head.append(style);function ask(type,minutes,label){return new Promise(resolve=>{const m=document.createElement("div");m.className="ec166-modal";m.innerHTML=`<div class="ec166-dialog" role="dialog" aria-modal="true"><h2>Password required</h2><p>${label}</p><form><input id="ec166-password" type="password" autocomplete="current-password" required><div class="ec166-dialog-actions"><button type="button" id="ec166-cancel" class="text-button">Cancel</button><button type="submit" class="primary-button">Confirm</button></div><p id="ec166-error" class="ec166-status"></p></form></div>`;document.body.append(m);const f=m.querySelector("form"),p=m.querySelector("#ec166-password"),e=m.querySelector("#ec166-error");m.querySelector("#ec166-cancel").onclick=()=>{m.remove();resolve(false)};f.onsubmit=async ev=>{ev.preventDefault();const r=await chrome.runtime.sendMessage({type,minutes,password:p.value}).catch(()=>({ok:false}));p.value="";if(!r?.ok){e.textContent="Incorrect password or action unavailable.";p.focus();return;}m.remove();resolve(true)};p.focus();})}function inject(){const root=$("#protected-content");if(!root||$("#ec166-controls"))return;const s=document.createElement("section");s.id="ec166-controls";s.className="ec166-card";s.innerHTML='<div class="ec166-head"><div><p class="ec166-kicker">Protection control</p><h2>Temporary pause</h2><p class="ec166-copy">Pause and resume are available only from this password-protected Options page.</p></div><span id="ec166-pill" class="ec166-pill">Protection ON</span></div><div class="ec166-actions"><button type="button" data-ec166="15">15 minutes</button><button type="button" data-ec166="60">1 hour</button><button type="button" data-ec166="1440">24 hours</button><button type="button" id="ec166-resume" class="wide">Resume protection</button></div>';root.insertBefore(s,root.firstChild);const refresh=async()=>{const st=await chrome.runtime.sendMessage({type:"edgeclose-admin-state"}).catch(()=>null);const pill=$("#ec166-pill");if(pill&&st){pill.textContent=st.paused?"Protection paused":"Protection ON";pill.classList.toggle("paused",!!st.paused);}};s.querySelectorAll('[data-ec166]').forEach(b=>b.onclick=()=>ask('edgeclose-pause',Number(b.dataset.ec166),'Enter your settings password to pause protection.').then(refresh));$("#ec166-resume").onclick=()=>ask('edgeclose-resume',0,'Enter your settings password to resume protection.').then(refresh);refresh()}inject()})();'''
          Path('options-pro-v166.js').write_text(pro)

          # Privacy/changelog.
          pp=Path('privacy-policy.html').read_text()
          pp=re.sub(r'(?is)<h2>Encrypted backup</h2>.*?<h2>Audit log</h2>','<h2>Local audit log</h2><p>EdgeClose maintains one current management log at <code>Downloads/EdgeClose/audit-log.json</code>. Configuration and recovery backups are not downloaded automatically.</p><p>The audit file contains management events only and does not record passwords, URLs, page titles, page contents, or rule patterns.</p><h2>Audit log</h2>',pp)
          pp=re.sub(r'(?is)The Options page may request public release metadata.*?request\.', 'EdgeClose does not contact GitHub or another remote update service to check versions. Microsoft Edge manages updates for Store-installed extensions.', pp)
          Path('privacy-policy.html').write_text(pp)
          old=show('CHANGELOG.md')
          Path('CHANGELOG.md').write_text('## v1.6.6\n\n- Complete rebuild from the full v1.6.2 source baseline.\n- Self-contained timer/rule service worker with no cross-version import.\n- Correct password-gated pause/resume responses.\n- Options-only control surface; no popup UI.\n- Single current audit log in `Downloads/EdgeClose/audit-log.json`; no automatic config/recovery downloads.\n- Microsoft Edge remains the Store update authority; GitHub polling removed.\n- Fixed Options null-reference handling and AudioContext gesture policy.\n- Strengthened exact deadline closure retry handling.\n\n'+old)

          # Remove old executable/source artifacts and zips from the new release source tree.
          for name in ['background-v160.js','background-v163.js','background-v164.js','background-v165.js','options-pro.js','options-pro-v163.js','options-pro-v164.js','options-pro-v165.js','backup-lifecycle.js','popup.html','popup.css','popup.js']:
            p=Path(name)
            if p.exists(): p.unlink()
          for p in Path('.').glob('EdgeClose-*.zip'):
            p.unlink()
          PY
          node --check background-v166.js
          node --check content.js
          node --check options.js
          node --check options-pro-v166.js
          node -e "const fs=require('fs'),m=require('./manifest.json');const v=fs.readFileSync('VERSION','utf8').trim();if(m.version!==v||v!=='1.6.6')throw Error('version mismatch');if(m.background.service_worker!=='background-v166.js')throw Error('worker mismatch');const required=['manifest.json','background-v166.js','content.js','content.css','options.html','options.css','options.js','options-pro-v166.js','managed_schema.json','privacy-policy.html'];for(const f of required)if(!fs.existsSync(f))throw Error('missing '+f);for(const f of ['background-v160.js','background-v163.js','background-v164.js','background-v165.js','options-pro.js','backup-lifecycle.js','popup.js'])if(fs.existsSync(f))throw Error('obsolete '+f);const h=fs.readFileSync('options.html','utf8');if(h.includes('backup-lifecycle.js')||h.includes('options-pro.js')||h.includes('popup.js'))throw Error('stale html');const b=fs.readFileSync('background-v166.js','utf8');for(const s of ['siteForTab','schedule','reschedule','closeIfDue','markActive','verifyActionPassword','EdgeClose/audit-log.json'])if(!b.includes(s))throw Error('missing core '+s);if(b.includes('importScripts(')||b.includes('edgeclose-backup-now')||b.includes('config-audit.enc')||b.includes('encryptedBackup'))throw Error('legacy code remains');if(fs.readFileSync('content.js','utf8').includes('new AudioContext()')&&!fs.readFileSync('content.js','utf8').includes('initAudioFromGesture'))throw Error('audio policy regression');"
      - name: Commit release source only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Do not modify workflow files from the Actions token; they are synchronized separately.
          git restore .github/workflows/package.yml || true
          git restore .github/workflows/validate.yml || true
          rm -f .github/workflows/release-v166.yml
          rm -f FORCE_REBUILD_TRIGGER.txt
          git add -A -- ':!*.yml' ':!*.yaml'
          git commit -m "Release EdgeClose v1.6.6 complete rebuild"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
