name: Rebuild EdgeClose v1.6.5

on:
  push:
    paths:
      - ".github/workflows/rebuild-v165.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild from v1.6.2 canonical source
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          root = Path('.')
          baseline = 'v1.6.2'

          def git_file(path):
              import subprocess
              return subprocess.check_output(['git', 'show', f'{baseline}:{path}'], text=True)

          # Restore the complete v1.6.2 runtime/UI source, then apply targeted changes.
          for name in [
              'background-v160.js', 'content.js', 'content.css',
              'options.html', 'options.css', 'options.js', 'options-pro.js',
              'managed_schema.json', 'privacy-policy.html', 'README.md'
          ]:
              (root / name).write_text(git_file(name))

          # Manifest: self-contained v1.6.5; no GitHub polling permission.
          manifest = json.loads(git_file('manifest.json'))
          manifest['version'] = '1.6.5'
          manifest['permissions'] = ['tabs', 'storage', 'alarms', 'downloads']
          manifest['host_permissions'] = ['<all_urls>']
          manifest['background'] = {'service_worker': 'background-v165.js'}
          manifest['options_page'] = 'options.html'
          manifest['action'] = {'default_title': 'EdgeClose'}
          (root/'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          (root/'VERSION').write_text('1.6.5\n')

          # Full background runtime. No dependency on another versioned service worker.
          bg = git_file('background-v160.js')
          bg = bg.replace('const VERSION = "1.6.0";', 'const VERSION = "1.6.5";')
          bg = bg.replace('const PUBLIC_KEY = "edgeclose-backup-public-key";\nconst BACKUP_PATH = "EdgeClose/config-audit.enc";\n', '')
          bg = re.sub(r'\nasync function publicKey\(\) \{.*?\nlet backupQueue = Promise\.resolve\(\); function queueBackup\(\) \{.*?\n\n', '\n', bg, flags=re.S)

          # Replace audit implementation with one persistent, non-sensitive log file.
          audit_replacement = r'''
          let auditWriteQueue = Promise.resolve();
          function auditDataUrl(value) {
            return `data:application/json;charset=utf-8,${encodeURIComponent(JSON.stringify(value, null, 2))}`;
          }
          async function writeAuditFile(entries) {
            auditWriteQueue = auditWriteQueue.then(async () => {
              try {
                const existing = await chrome.downloads.search({ filename: "EdgeClose/audit-log.json" });
                const ids = existing.map((item) => item.id).filter(Number.isInteger);
                if (ids.length) await chrome.downloads.erase({ id: ids[0] }).catch(() => {});
                await chrome.downloads.download({
                  url: auditDataUrl({ schemaVersion: 1, version: VERSION, generatedAt: Date.now(), events: entries.slice(0, MAX_AUDIT) }),
                  filename: "EdgeClose/audit-log.json",
                  saveAs: false,
                  conflictAction: "overwrite"
                });
              } catch {}
            }).catch(() => {});
            return auditWriteQueue;
          }
          async function audit(event, metadata = {}) {
            const blocked = new Set(["password", "passwordHash", "salt", "token", "secret", "url", "pattern", "title"]);
            const safe = {};
            for (const [k, v] of Object.entries(metadata)) {
              if (!blocked.has(k) && ["string", "number", "boolean"].includes(typeof v)) safe[k] = v;
            }
            const s = await chrome.storage.local.get(AUDIT_KEY);
            const current = Array.isArray(s[AUDIT_KEY]) ? s[AUDIT_KEY] : [];
            const next = [{ timestamp: Date.now(), event: String(event).slice(0, 40), metadata: safe }, ...current].slice(0, MAX_AUDIT);
            await chrome.storage.local.set({ [AUDIT_KEY]: next });
            await writeAuditFile(next);
          }
          '''
          bg = re.sub(r'async function audit\(event, metadata = \{\}\) \{.*?\nasync function closeIfDue', audit_replacement + '\nasync function closeIfDue', bg, flags=re.S)

          # Remove startup automatic config backup call if present.
          bg = re.sub(r'\s*queueBackup\(\);', '', bg)

          # Authenticate pause/resume in the service worker itself.
          auth_block = r'''
          const AUTH_HASH_KEY = "edgeclose-settings-password-hash";
          const AUTH_SALT_KEY = "edgeclose-settings-password-salt";
          const AUTH_ITERATIONS_KEY = "edgeclose-settings-password-iterations";
          async function verifyActionPassword(password) {
            try {
              const stored = await chrome.storage.local.get([AUTH_HASH_KEY, AUTH_SALT_KEY, AUTH_ITERATIONS_KEY]);
              if (!stored[AUTH_HASH_KEY] || !stored[AUTH_SALT_KEY]) return false;
              const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(String(password || "")), "PBKDF2", false, ["deriveBits"]);
              const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: Uint8Array.from(atob(stored[AUTH_SALT_KEY]), (c) => c.charCodeAt(0)), iterations: Number(stored[AUTH_ITERATIONS_KEY]) || 310000, hash: "SHA-256" }, key, 256);
              const actual = new Uint8Array(bits);
              const expected = Uint8Array.from(atob(stored[AUTH_HASH_KEY]), (c) => c.charCodeAt(0));
              if (actual.length !== expected.length) return false;
              let diff = 0;
              for (let i = 0; i < actual.length; i += 1) diff |= actual[i] ^ expected[i];
              return diff === 0;
            } catch { return false; }
          }
          '''
          bg = bg.replace('\nasync function setPause(minutes)', '\n' + auth_block + '\nasync function setPause(minutes, password)')
          bg = bg.replace('async function setPause(minutes) { const n =', 'async function setPause(minutes, password) { if (!(await verifyActionPassword(password))) return 0; const n =')
          bg = bg.replace('async function resume() { const n', 'async function resume(password) {') if 'async function resume() { const n' in bg else bg
          bg = bg.replace('async function resume() { await chrome.storage.local.remove(PAUSE_KEY);', 'async function resume(password) { if (!(await verifyActionPassword(password))) return false; await chrome.storage.local.remove(PAUSE_KEY);')
          bg = bg.replace('setPause(message.minutes).then', 'setPause(message.minutes, message.password).then')
          bg = bg.replace('resume().then', 'resume(message.password).then')

          # Ensure there is no manual backup message route left.
          bg = bg.replace(' if (message.type === "edgeclose-backup-now") { encryptedBackup().then(() => sendResponse({ ok: true })).catch(() => sendResponse({ ok: false })); return true; }', '')
          bg = bg.replace('if (message.type === "edgeclose-backup-now") { encryptedBackup().then(() => sendResponse({ ok: true })).catch(() => sendResponse({ ok: false })); return true; }', '')

          (root/'background-v165.js').write_text(bg)

          # Content: keep full 1.6.2 timer engine but make AudioContext gesture-only and add deadline retry.
          content = git_file('content.js')
          if 'function initAudioFromGesture()' not in content:
              content = content.replace('let audioContext;\n', 'let audioContext;\nlet deadlineRetryTimer;\n')
              content = content.replace('''function playWarningSound() {
  try {
    if (!audioContext) audioContext = new AudioContext();
    if (audioContext.state === "suspended") audioContext.resume();''', '''function initAudioFromGesture() {
  if (!soundEnabled || audioContext) return;
  try {
    audioContext = new AudioContext();
    if (audioContext.state === "suspended") audioContext.resume().catch(() => {});
  } catch { audioContext = null; }
}
function playWarningSound() {
  try {
    if (!audioContext || audioContext.state !== "running") return;''')
              content = content.replace('''    if (soundEnabled && !audioContext) {
      try { audioContext = new AudioContext(); } catch { audioContext = null; }
    }
    if (soundEnabled && audioContext?.state === "suspended") audioContext.resume().catch(() => {});''', '    initAudioFromGesture();')
          # Replace deadline timer with reliable retry after exact deadline.
          content = re.sub(r'function armDeadlineTimer\(\) \{.*?\n\}', '''function armDeadlineTimer() {
  window.clearTimeout(deadlineTimer);
  window.clearInterval(deadlineRetryTimer);
  if (!deadlineAt || !scheduleActive || window.top !== window) return;
  const trigger = () => chrome.runtime.sendMessage({ type: "edgeclose-deadline" }).catch(() => {});
  const delay = Math.max(0, deadlineAt - Date.now());
  deadlineTimer = window.setTimeout(() => {
    trigger();
    let attempts = 0;
    deadlineRetryTimer = window.setInterval(() => {
      attempts += 1;
      if (!scheduleActive || Date.now() + 1000 < deadlineAt || attempts > 8) {
        window.clearInterval(deadlineRetryTimer);
        return;
      }
      trigger();
    }, 1000);
  }, delay);
}''', content, count=1, flags=re.S)
          content = content.replace('window.clearTimeout(deadlineTimer);\n    deadlineAt = 0;', 'window.clearTimeout(deadlineTimer);\n    window.clearInterval(deadlineRetryTimer);\n    deadlineAt = 0;')
          (root/'content.js').write_text(content)

          # Options UI: use complete v1.6.2 page but remove automatic config backup + GitHub updater.
          html = git_file('options.html')
          html = html.replace('<script src="backup-lifecycle.js"></script>', '')
          html = html.replace('EdgeClose checks published releases for newer versions. Passwords and browsing data are never included.', 'Microsoft Edge manages updates for extensions installed from the Microsoft Edge Add-ons Store.')
          html = html.replace('<ul id="available-versions" class="version-list" aria-label="Available releases"></ul>', '')
          html = html.replace('<button type="button" id="check-updates" class="text-button">Check now</button>', '')
          html = html.replace('<script src="options-pro.js"></script>', '<script src="options-pro-v165.js"></script>')
          (root/'options.html').write_text(html)

          # Options logic: preserve full settings/auth code, remove remote update fetching and add null safety.
          opts = git_file('options.js')
          start = opts.find('async function checkForUpdates() {')
          end = opts.find('\n\ncheckUpdatesButton.addEventListener', start)
          if start >= 0:
              if end < 0: end = len(opts)
              opts = opts[:start] + "async function checkForUpdates() { if (updateStatus) updateStatus.textContent = 'Microsoft Edge manages Store updates automatically.'; if (availableVersion) availableVersion.textContent = currentVersion; if (availableVersions) availableVersions.replaceChildren(); }" + opts[end:]
          opts = opts.replace('checkUpdatesButton.addEventListener("click", checkForUpdates);', 'checkUpdatesButton?.addEventListener?.("click", checkForUpdates);')
          opts = opts.replace('async function loadAuditLog() {\n  const entries', 'async function loadAuditLog() {\n  if (!auditList || !auditEmpty) return;\n  const entries')
          opts = opts.replace('async function refreshDashboard() {\n  const state', 'async function refreshDashboard() {\n  if (!policySource || !policyPrecedence || !ruleCount || !monitoredCount || !protectionState || !pauseState) return;\n  const state')
          opts = opts.replace('function unlockSettings() {\n  authGate.hidden = true;', 'function unlockSettings() {\n  if (!authGate || !protectedContent) return;\n  authGate.hidden = true;')
          (root/'options.js').write_text(opts)

          # Pro UI helper: copy complete baseline, then make pause/resume authenticated.
          pro = git_file('options-pro.js')
          pro = pro.replace('edgeclose-pause', 'edgeclose-pause')
          # Replace existing pause/resume message payloads with password-gated helper using the baseline auth verifier.
          pro = '''(() => {
  const $ = (selector) => document.querySelector(selector);
  const askPassword = (action, label) => new Promise((resolve) => {
    const existing = document.getElementById('edgeclose-auth-modal');
    if (existing) existing.remove();
    const modal = document.createElement('div');
    modal.id = 'edgeclose-auth-modal';
    modal.className = 'ec160-modal';
    modal.innerHTML = `<div class="ec160-dialog" role="dialog" aria-modal="true" aria-labelledby="edgeclose-auth-title"><h2 id="edgeclose-auth-title">Password required</h2><p>${label}</p><form id="edgeclose-auth-form"><input id="edgeclose-action-password" type="password" autocomplete="current-password" required><div class="ec160-dialog-actions"><button type="button" id="edgeclose-action-cancel" class="text-button">Cancel</button><button type="submit" class="primary-button">Confirm</button></div><p id="edgeclose-action-error" class="ec160-status"></p></form></div>`;
    document.body.append(modal);
    const form = $('#edgeclose-auth-form');
    const input = $('#edgeclose-action-password');
    const error = $('#edgeclose-action-error');
    const cleanup = () => modal.remove();
    $('#edgeclose-action-cancel').addEventListener('click', () => { cleanup(); resolve(false); }, { once: true });
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = input.value;
      const result = await chrome.runtime.sendMessage({ type: action.type, minutes: action.minutes, password }).catch(() => ({ ok: false }));
      input.value = '';
      if (!result?.ok) { error.textContent = 'Incorrect password or action unavailable.'; input.focus(); return; }
      cleanup(); resolve(true);
    }, { once: true });
    input.focus();
  });

  function inject() {
    const root = $('#protected-content');
    if (!root || $('#ec165-controls')) return;
    const section = document.createElement('section');
    section.id = 'ec165-controls';
    section.className = 'ec160-card';
    section.innerHTML = '<div class="ec160-head"><div><p class="ec160-kicker">Protection control</p><h2>Temporary pause</h2><p class="ec160-copy">Pause and resume are available only from this password-protected Options page.</p></div><span id="ec165-pill" class="ec160-pill">Protection ON</span></div><div class="ec160-actions"><button type="button" data-ec165-pause="15">15 minutes</button><button type="button" data-ec165-pause="60">1 hour</button><button type="button" data-ec165-pause="1440">24 hours</button><button id="ec165-resume" type="button" class="wide">Resume protection</button></div>';
    root.insertBefore(section, root.firstChild);

    const refresh = async () => {
      const state = await chrome.runtime.sendMessage({ type: 'edgeclose-admin-state' }).catch(() => null);
      const pill = $('#ec165-pill');
      if (pill && state) { pill.textContent = state.paused ? 'Protection paused' : 'Protection ON'; pill.classList.toggle('paused', Boolean(state.paused)); }
    };

    section.querySelectorAll('[data-ec165-pause]').forEach((button) => button.addEventListener('click', () => askPassword({ type: 'edgeclose-pause', minutes: Number(button.dataset.ec165Pause) }, 'Enter your settings password to pause protection.').then(refresh)));
    $('#ec165-resume').addEventListener('click', () => askPassword({ type: 'edgeclose-resume' }, 'Enter your settings password to resume protection.').then(refresh));
    refresh();
  }
  inject();
})();
'''
          (root/'options-pro-v165.js').write_text(pro)

          # Remove obsolete runtime sources/artifacts from the working tree/package candidate.
          for name in ['background-v160.js', 'backup-lifecycle.js', 'options-pro.js', 'options-pro-v164.js', 'options-pro-v163.js', 'background-v163.js', 'background-v164.js', 'popup.html', 'popup.css', 'popup.js']:
              p = root/name
              if p.exists(): p.unlink()
          for p in root.glob('EdgeClose-*.zip'):
              p.unlink()

          # Privacy policy and changelog are kept synchronized with the new behavior.
          pp = git_file('privacy-policy.html')
          pp = re.sub(r'(?is)<h2>Encrypted backup</h2>.*?<h2>Audit log</h2>', '<h2>Local audit log</h2><p>EdgeClose keeps a bounded management audit log locally and maintains one up-to-date copy as <code>Downloads/EdgeClose/audit-log.json</code>. Configuration and recovery backups are not downloaded automatically.</p><p>The audit file contains management events only and does not record passwords, website URLs, page titles, page contents, or rule patterns.</p><h2>Audit log</h2>', pp)
          pp = re.sub(r'(?is)The Options page may request public release metadata.*?request\.', 'EdgeClose does not contact GitHub or another remote update service to check extension versions. Microsoft Edge manages updates for Store-installed extensions.', pp)
          (root/'privacy-policy.html').write_text(pp)

          ch = git_file('CHANGELOG.md')
          entry = '''## v1.6.5\n\n- Rebuilt the extension from the complete v1.6.2 source baseline to restore missing runtime code.\n- Use a self-contained v1.6.5 service worker with no cross-version imports.\n- Keep Options as the single control surface; no popup UI.\n- Authenticate every temporary pause/resume action.\n- Keep only one audit-log file in `Downloads/EdgeClose/audit-log.json`; automatic configuration/recovery downloads are removed.\n- Remove GitHub release polling from the extension; Store updates are managed by Microsoft Edge.\n- Fix Options null-reference handling and warning-audio gesture policy.\n- Strengthen exact-deadline closure with a retry window.\n\n'''
          if not ch.startswith('## v1.6.5'):
              (root/'CHANGELOG.md').write_text(entry + ch)

          # Remove one-time rebuild workflow after generating the final source; the package/validation workflows remain.
          (root/'.github/workflows/rebuild-v165.yml').unlink(missing_ok=True)
          PY

          node --check background-v165.js
          node --check content.js
          node --check options.js
          node --check options-pro-v165.js
          node -e "const fs=require('fs'); const m=require('./manifest.json'); const v=fs.readFileSync('VERSION','utf8').trim(); if(m.version!==v||v!=='1.6.5') process.exit(1); if(m.background.service_worker!=='background-v165.js') process.exit(1); if(m.host_permissions.some(x=>x.includes('api.github.com'))) process.exit(1); if(fs.existsSync('backup-lifecycle.js')||fs.existsSync('popup.js')) process.exit(1);"

      - name: Commit rebuilt source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild EdgeClose v1.6.5 from complete v1.6.2 source" || exit 0
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
